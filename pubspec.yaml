name: sae_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^16.2.1

  # Forms
  flutter_form_builder: ^11.0.0
  form_builder_validators: ^11.1.2
  flutter_rating_bar: ^4.0.1

  # Database
  sqflite: ^2.4.2
  sqflite_common_ffi_web: ^1.1.2

  # State / Storage
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # Security / utilities
  crypto: ^3.0.6
  url_launcher: ^6.3.2

  # Settings
  settings_ui: ^2.0.2

  # Maps / location
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  flutter_map_cancellable_tile_provider: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.7.1
  build: ^4.0.2
  mockito: ^5.5.0
  coverage: ^1.15.0

flutter:
  uses-material-design: true

  assets:
    - assets/bd.sql
    - assets/restaurants.json